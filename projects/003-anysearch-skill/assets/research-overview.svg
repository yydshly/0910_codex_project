<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2690" viewBox="0 0 1680 2690" role="img" aria-labelledby="title desc">
<title id="title">AnySearch Skill 完整理解总览</title>
<desc id="desc">区分开源客户端与未公开的远端搜索服务；介绍四类能力、收费与证据、同类产品、五种开源 Agent 的搜索来源和研究方向。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style>
<rect width="1680" height="2690" fill="#f4f7fb"/>
<rect x="0" y="0" width="1680" height="206" rx="0" fill="#102a43"/>
<rect x="56" y="34" width="156" height="32" rx="8" fill="#244660"/>
<text x="68" y="54.62" font-size="17" font-weight="700" fill="#d5e7fa">开源项目研究 003</text>
<text x="56" y="125.14" font-size="49" font-weight="700" fill="#ffffff">AnySearch Skill：客户端、服务端与搜索生态</text>
<text x="56" y="176.5" font-size="25" font-weight="400" fill="#d6e4f2">核心判断：仓库开源的是接入层；搜索由云端服务执行，后端实现未公开。</text>
<rect x="56" y="240" width="45" height="40" rx="10" fill="#132c45"/>
<text x="65" y="265.92" font-size="22" font-weight="700" fill="#ffffff">01</text>
<text x="116" y="268.94" font-size="29" font-weight="700" fill="#132c45">先看清边界：我们下载的是什么？</text>
<rect x="56" y="300" width="298" height="245" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<text x="80" y="348.22" font-size="27" font-weight="700" fill="#132c45">已有的 AI Agent</text>
<text x="80" y="395.64" font-size="24" font-weight="400" fill="#52677d">理解用户问题</text>
<text x="80" y="434.64" font-size="24" font-weight="400" fill="#52677d">决定何时使用工具</text>
<text x="80" y="473.64" font-size="24" font-weight="400" fill="#52677d">核对资料、组织回答</text>
<text x="80" y="525.2" font-size="20" font-weight="400" fill="#245bb2">Skill 不修改模型参数</text>
<rect x="394" y="300" width="502" height="245" rx="18" fill="#e9f1ff" stroke="#bfd2ee"/>
<text x="418" y="348.22" font-size="27" font-weight="700" fill="#245bb2">AnySearch Skill 客户端</text>
<text x="418" y="392.92" font-size="22" font-weight="400" fill="#52677d">SKILL.md：发现能力、选择领域、填参数</text>
<text x="418" y="431.92" font-size="22" font-weight="400" fill="#52677d">CLI：HTTP 调用、并发、错误与结果格式</text>
<text x="418" y="470.92" font-size="22" font-weight="400" fill="#52677d">Python / Node.js / PowerShell / Bash</text>
<text x="418" y="525.2" font-size="20" font-weight="400" fill="#245bb2">开源 · Apache-2.0 · 本仓库可研究的实现</text>
<rect x="936" y="300" width="688" height="245" rx="18" fill="#fff4df" stroke="#edd4a4"/>
<text x="960" y="349.08" font-size="28" font-weight="700" fill="#96601b">AnySearch 云端服务</text>
<text x="960" y="391.78" font-size="23" font-weight="400" fill="#132c45">api.anysearch.com：执行搜索、专业查询、正文抽取</text>
<text x="960" y="432.92" font-size="22" font-weight="400" fill="#96601b">官方声明：多来源接入、意图路由、跨领域重排</text>
<text x="960" y="473.92" font-size="22" font-weight="400" fill="#52677d">未知：完整供应商、索引、模型、排序与抓取实现</text>
<text x="960" y="526.06" font-size="21" font-weight="700" fill="#96601b">下载客户端 ≠ 获得可自行部署的完整搜索后端</text>
<line x1="360" y1="410" x2="380" y2="410" stroke="#245bb2" stroke-width="3"/>
<polygon points="388,410 378,403 378,417" fill="#245bb2"/>
<line x1="902" y1="410" x2="922" y2="410" stroke="#245bb2" stroke-width="3"/>
<polygon points="930,410 920,403 920,417" fill="#245bb2"/>
<rect x="56" y="566" width="1568" height="73" rx="12" fill="#e8f3ef"/>
<text x="80" y="602.64" font-size="24" font-weight="700" fill="#116c59">调用链：发现能力 → 参数化搜索 → 按需读取正文 → Markdown 返回 Agent</text>
<text x="80" y="630.48" font-size="18" font-weight="400" fill="#116c59">GET /v1/sub-domains     POST /v1/search     POST /v1/extract    ｜    数据传输 JSON，客户端主要输出 Markdown</text>
<rect x="56" y="683" width="45" height="40" rx="10" fill="#132c45"/>
<text x="65" y="708.92" font-size="22" font-weight="700" fill="#ffffff">02</text>
<text x="116" y="711.94" font-size="29" font-weight="700" fill="#132c45">能力来自服务；客户端把它们组织成可调用工具</text>
<rect x="56" y="740" width="368" height="174" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<text x="76" y="784.36" font-size="26" font-weight="700" fill="#116c59">通用搜索</text>
<text x="76" y="822.06" font-size="21" font-weight="400" fill="#132c45">问题 → 标题、链接、摘要</text>
<text x="76" y="859.34" font-size="19" font-weight="400" fill="#52677d">单次 1–10 条结果</text>
<text x="76" y="888.34" font-size="19" font-weight="400" fill="#52677d">search</text>
<rect x="456" y="740" width="368" height="174" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<text x="476" y="784.36" font-size="26" font-weight="700" fill="#116c59">专业数据查询</text>
<text x="476" y="822.06" font-size="21" font-weight="400" fill="#132c45">标识 + 筛选条件 → 专业记录</text>
<text x="476" y="859.34" font-size="19" font-weight="400" fill="#52677d">行情 / 论文引用 / 航班 / 漏洞等</text>
<text x="476" y="888.34" font-size="19" font-weight="400" fill="#52677d">先查目录，再选 tag / params</text>
<rect x="856" y="740" width="368" height="174" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<text x="876" y="784.36" font-size="26" font-weight="700" fill="#116c59">并行检索</text>
<text x="876" y="822.06" font-size="21" font-weight="400" fill="#132c45">1–5 项独立查询同时执行</text>
<text x="876" y="859.34" font-size="19" font-weight="400" fill="#52677d">按输入顺序输出，允许部分失败</text>
<text x="876" y="888.34" font-size="19" font-weight="400" fill="#52677d">每个查询分别计算请求额度</text>
<rect x="1256" y="740" width="368" height="174" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<text x="1276" y="784.36" font-size="26" font-weight="700" fill="#116c59">正文抽取</text>
<text x="1276" y="822.06" font-size="21" font-weight="400" fill="#132c45">URL → 可读正文</text>
<text x="1276" y="859.34" font-size="19" font-weight="400" fill="#52677d">HTML / 文本 / JSON / Markdown</text>
<text x="1276" y="888.34" font-size="19" font-weight="400" fill="#52677d">不支持 PDF、Word、图片、音视频</text>
<text x="56" y="952.92" font-size="22" font-weight="400" fill="#52677d">目录实查：17 个领域 / 40 个子能力；数量表示公开目录规模，不代表全部已实测或优于其他搜索。</text>
<rect x="56" y="991" width="45" height="40" rx="10" fill="#132c45"/>
<text x="65" y="1016.92" font-size="22" font-weight="700" fill="#ffffff">03</text>
<text x="116" y="1019.94" font-size="29" font-weight="700" fill="#132c45">区分证据、服务声明与会员权限</text>
<rect x="56" y="1048" width="768" height="237" rx="18" fill="#e8f3ef" stroke="#c4ded4"/>
<text x="80" y="1095.22" font-size="27" font-weight="700" fill="#116c59">我们已经确认</text>
<text x="80" y="1136.92" font-size="22" font-weight="400" fill="#132c45">源码：接口、参数转换、并发、输出和共享规范</text>
<text x="80" y="1173.92" font-size="22" font-weight="400" fill="#132c45">实测：Python / Node.js / PowerShell 本地接口测试</text>
<text x="80" y="1210.92" font-size="22" font-weight="400" fill="#132c45">在线：通用搜索、React 文档搜索、网页正文抽取</text>
<text x="80" y="1247.92" font-size="22" font-weight="400" fill="#132c45">未证实：浏览器 / RSS / 自建索引的具体组合</text>
<rect x="848" y="1048" width="776" height="237" rx="18" fill="#fff4df" stroke="#edd4a4"/>
<text x="872" y="1094.36" font-size="26" font-weight="700" fill="#96601b">服务有免费额度；专业能力 ≠ 网站会员</text>
<text x="872" y="1136.92" font-size="22" font-weight="400" fill="#132c45">Free：$0/月 · 1,000 次/日 · 每 Key 20 QPS</text>
<text x="872" y="1173.92" font-size="22" font-weight="400" fill="#132c45">Pro：即将推出；Enterprise：联系销售</text>
<text x="872" y="1210.92" font-size="22" font-weight="400" fill="#132c45">匿名额度更低；没有公开逐能力套餐对照表</text>
<text x="872" y="1247.92" font-size="22" font-weight="400" fill="#132c45">没有证据表明用户获得第三方付费数据库/全文权限</text>
<rect x="56" y="1330" width="45" height="40" rx="10" fill="#132c45"/>
<text x="65" y="1355.92" font-size="22" font-weight="700" fill="#ffffff">04</text>
<text x="116" y="1358.94" font-size="29" font-weight="700" fill="#132c45">同类产品：比较实际服务，而不只看 Skill 包装</text>
<rect x="56" y="1387" width="368" height="124" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<a href="https://docs.tavily.com/documentation/about" target="_blank">
<text x="76" y="1425.5" font-size="25" font-weight="700" fill="#132c45">Tavily</text>
</a>
<text x="76" y="1463.06" font-size="21" font-weight="400" fill="#52677d">Agent 搜索、筛选与提取</text>
<text x="76" y="1493.48" font-size="18" font-weight="400" fill="#245bb2">托管 API</text>
<rect x="456" y="1387" width="368" height="124" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<a href="https://exa.ai/docs/reference/the-exa-index" target="_blank">
<text x="476" y="1425.5" font-size="25" font-weight="700" fill="#132c45">Exa</text>
</a>
<text x="476" y="1463.06" font-size="21" font-weight="400" fill="#52677d">自有索引、语义与内容检索</text>
<text x="476" y="1493.48" font-size="18" font-weight="400" fill="#245bb2">托管 API</text>
<rect x="856" y="1387" width="368" height="124" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<a href="https://brave.com/search/api/" target="_blank">
<text x="876" y="1425.5" font-size="25" font-weight="700" fill="#132c45">Brave Search API</text>
</a>
<text x="876" y="1463.06" font-size="21" font-weight="400" fill="#52677d">独立网页索引与排序</text>
<text x="876" y="1493.48" font-size="18" font-weight="400" fill="#245bb2">托管 API</text>
<rect x="1256" y="1387" width="368" height="124" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<a href="https://docs.parallel.ai/getting-started/overview" target="_blank">
<text x="1276" y="1425.5" font-size="25" font-weight="700" fill="#132c45">Parallel</text>
</a>
<text x="1276" y="1463.06" font-size="21" font-weight="400" fill="#52677d">搜索、提取、多步骤研究</text>
<text x="1276" y="1493.48" font-size="18" font-weight="400" fill="#245bb2">托管 API</text>
<rect x="56" y="1526" width="368" height="124" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<a href="https://docs.perplexity.ai/docs/search/quickstart" target="_blank">
<text x="76" y="1564.5" font-size="25" font-weight="700" fill="#132c45">Perplexity Search</text>
</a>
<text x="76" y="1602.06" font-size="21" font-weight="400" fill="#52677d">排序结果、过滤与内容获取</text>
<text x="76" y="1632.48" font-size="18" font-weight="400" fill="#245bb2">答案生成另有 Agent API</text>
<rect x="456" y="1526" width="368" height="124" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<a href="https://docs.firecrawl.dev/contributing/open-source-or-cloud" target="_blank">
<text x="476" y="1564.5" font-size="25" font-weight="700" fill="#132c45">Firecrawl</text>
</a>
<text x="476" y="1602.06" font-size="21" font-weight="400" fill="#52677d">搜索、抓取、正文提取</text>
<text x="476" y="1632.48" font-size="18" font-weight="400" fill="#245bb2">开源与云版能力需区分</text>
<rect x="856" y="1526" width="368" height="124" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<a href="https://serpapi.com/search-api" target="_blank">
<text x="876" y="1564.5" font-size="25" font-weight="700" fill="#132c45">SerpApi</text>
</a>
<text x="876" y="1602.06" font-size="21" font-weight="400" fill="#52677d">提供 Google 等搜索结果</text>
<text x="876" y="1632.48" font-size="18" font-weight="400" fill="#245bb2">搜索结果 API</text>
<rect x="1256" y="1526" width="368" height="124" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<a href="https://docs.searxng.org/" target="_blank">
<text x="1276" y="1564.5" font-size="25" font-weight="700" fill="#132c45">SearXNG</text>
</a>
<text x="1276" y="1602.06" font-size="21" font-weight="400" fill="#52677d">聚合多个上游搜索来源</text>
<text x="1276" y="1632.48" font-size="18" font-weight="400" fill="#245bb2">服务端开源，可自行部署</text>
<rect x="56" y="1700" width="45" height="40" rx="10" fill="#132c45"/>
<text x="65" y="1725.92" font-size="22" font-weight="700" fill="#ffffff">05</text>
<text x="116" y="1728.94" font-size="29" font-weight="700" fill="#132c45">开源 Agent → 搜索工具 → 实际调用来源</text>
<rect x="56" y="1757" width="1568" height="438" rx="18" fill="#ffffff" stroke="#d9e2ec"/>
<rect x="56" y="1757" width="1568" height="51" rx="12" fill="#dfe9f4"/>
<text x="80" y="1790.92" font-size="22" font-weight="700" fill="#132c45">开源 Agent / 核心</text>
<text x="354" y="1790.92" font-size="22" font-weight="700" fill="#132c45">工具入口</text>
<text x="677" y="1790.92" font-size="22" font-weight="700" fill="#132c45">搜索来源</text>
<text x="1190" y="1790.92" font-size="22" font-weight="700" fill="#132c45">启用与开源边界</text>
<text x="80" y="1849.5" font-size="25" font-weight="700" fill="#132c45">Codex CLI</text>
<text x="354" y="1847.2" font-size="20" font-weight="400" fill="#52677d">web_search</text>
<text x="677" y="1845.06" font-size="21" font-weight="400" fill="#116c59">OpenAI 托管搜索</text>
<text x="1190" y="1844.2" font-size="20" font-weight="400" fill="#52677d">CLI 开源；搜索后端独立</text>
<text x="1190" y="1872.2" font-size="20" font-weight="400" fill="#52677d">缓存 / live 等模式</text>
<line x1="76" y1="1881" x2="1604" y2="1881" stroke="#e4ebf2" stroke-width="1"/>
<text x="80" y="1922.5" font-size="25" font-weight="700" fill="#132c45">Gemini CLI</text>
<text x="354" y="1920.2" font-size="20" font-weight="400" fill="#52677d">google_web_search</text>
<text x="677" y="1918.06" font-size="21" font-weight="400" fill="#116c59">Google Search grounding</text>
<text x="1190" y="1917.2" font-size="20" font-weight="400" fill="#52677d">由 Gemini API 处理结果</text>
<text x="1190" y="1945.2" font-size="20" font-weight="400" fill="#52677d">另有 web_fetch</text>
<line x1="76" y1="1954" x2="1604" y2="1954" stroke="#e4ebf2" stroke-width="1"/>
<text x="80" y="1995.5" font-size="25" font-weight="700" fill="#132c45">OpenCode</text>
<text x="354" y="1993.2" font-size="20" font-weight="400" fill="#52677d">websearch / webfetch</text>
<text x="677" y="1991.06" font-size="21" font-weight="400" fill="#116c59">Exa 或 Parallel</text>
<text x="1190" y="1990.2" font-size="20" font-weight="400" fill="#52677d">由 provider / 配置决定</text>
<text x="1190" y="2018.2" font-size="20" font-weight="400" fill="#52677d">支持不等于无条件启用</text>
<line x1="76" y1="2027" x2="1604" y2="2027" stroke="#e4ebf2" stroke-width="1"/>
<text x="80" y="2068.5" font-size="25" font-weight="700" fill="#132c45">OpenClaw</text>
<text x="354" y="2066.2" font-size="20" font-weight="400" fill="#52677d">web_search / web_fetch</text>
<text x="677" y="2064.06" font-size="21" font-weight="400" fill="#116c59">Brave / Exa / Tavily / Parallel …</text>
<text x="677" y="2092.06" font-size="21" font-weight="400" fill="#116c59">也可配置 SearXNG 等</text>
<text x="1190" y="2063.2" font-size="20" font-weight="400" fill="#52677d">按配置与凭据选择</text>
<text x="1190" y="2091.2" font-size="20" font-weight="400" fill="#52677d">多个供应商不等于全部启用</text>
<line x1="76" y1="2100" x2="1604" y2="2100" stroke="#e4ebf2" stroke-width="1"/>
<text x="80" y="2141.5" font-size="25" font-weight="700" fill="#132c45">Pi 默认核心</text>
<text x="354" y="2139.2" font-size="20" font-weight="400" fill="#52677d">read / write / edit / bash</text>
<text x="677" y="2137.06" font-size="21" font-weight="400" fill="#116c59">默认没有独立 web_search</text>
<text x="1190" y="2136.2" font-size="20" font-weight="400" fill="#52677d">通过扩展、Skill 或程序补充</text>
<text x="1190" y="2164.2" font-size="20" font-weight="400" fill="#52677d">模型本身不带入搜索服务</text>
<text x="56" y="2232.2" font-size="20" font-weight="400" fill="#52677d">其他产品：Claude Code → Anthropic 后端；Cursor → 内置搜索但固定供应商未明确；Grok API → 网页 + X 搜索。</text>
<rect x="56" y="2270" width="45" height="40" rx="10" fill="#132c45"/>
<text x="65" y="2295.92" font-size="22" font-weight="700" fill="#ffffff">06</text>
<text x="116" y="2298.94" font-size="29" font-weight="700" fill="#132c45">对我们的研究意味着什么？</text>
<rect x="56" y="2328" width="504" height="201" rx="18" fill="#e9f1ff"/>
<text x="78" y="2373.36" font-size="26" font-weight="700" fill="#245bb2">想研究接入层</text>
<text x="78" y="2412.06" font-size="21" font-weight="700" fill="#132c45">AnySearch / OpenCode / OpenClaw</text>
<text x="78" y="2458.06" font-size="21" font-weight="400" fill="#52677d">看能力目录、参数、并发、错误</text>
<text x="78" y="2492.06" font-size="21" font-weight="400" fill="#52677d">以及 Agent 如何组织工具调用</text>
<rect x="588" y="2328" width="504" height="201" rx="18" fill="#e8f3ef"/>
<text x="610" y="2373.36" font-size="26" font-weight="700" fill="#116c59">想研究服务端实现</text>
<text x="610" y="2412.06" font-size="21" font-weight="700" fill="#132c45">SearXNG / Crawl4AI / Firecrawl 开源版</text>
<text x="610" y="2458.06" font-size="21" font-weight="400" fill="#52677d">看搜索聚合、网页采集和正文抽取</text>
<text x="610" y="2492.06" font-size="21" font-weight="400" fill="#52677d">Crawl4AI 是抓取组件，不是全网索引</text>
<rect x="1120" y="2328" width="504" height="201" rx="18" fill="#fff4df"/>
<text x="1142" y="2373.36" font-size="26" font-weight="700" fill="#96601b">想判断是否值得安装</text>
<text x="1142" y="2412.06" font-size="21" font-weight="700" fill="#132c45">与 Agent 已有工具做同题对照</text>
<text x="1142" y="2458.06" font-size="21" font-weight="400" fill="#52677d">看准确率、数据覆盖、时效和成本</text>
