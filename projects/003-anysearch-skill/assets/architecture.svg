<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">AnySearch Skill 架构</title><desc id="desc">Agent 根据技能规范选择能力，跨平台客户端请求远端目录、搜索与抽取接口。后端未包含在仓库中。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#637b94"/></marker></defs>
