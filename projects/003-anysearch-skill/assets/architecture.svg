<text x="45" y="98" font-size="18" fill="#5a6e83">技能规范指导调用策略，客户端连接远端检索服务</text>
<rect x="45" y="132" width="690" height="300" rx="16" fill="#e5edf8"/>
<rect x="766" y="132" width="389" height="300" rx="16" fill="#e4f1ec"/>
