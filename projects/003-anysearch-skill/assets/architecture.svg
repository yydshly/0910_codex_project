<text x="296" y="250" font-size="22" font-weight="700" fill="#284768">Agent 决策</text>
<text x="296" y="285" font-size="16" fill="#5a6e83">读取技能，发现能力</text>
<text x="296" y="313" font-size="16" fill="#5a6e83">选择领域，补齐参数</text>
<rect x="512" y="209" width="201" height="128" rx="12" fill="white"/>
