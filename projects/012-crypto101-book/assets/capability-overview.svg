<text x="56" y="58" fill="#7dd3fc" font-size="18" letter-spacing="2">012 / CRYPTO 101</text>
<text x="56" y="120" fill="#ffffff" font-size="42" font-weight="700">理解密码学组件，读懂完整系统</text>
<text x="56" y="166" fill="#c7d5e8" font-size="22">面向程序员的入门书源码 · 从失败案例理解安全设计为什么必要</text>
