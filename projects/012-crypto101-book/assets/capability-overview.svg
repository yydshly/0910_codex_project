<text x="80" y="252" fill="#7dd3fc" font-size="18">01</text>
<text x="80" y="294" fill="#fff" font-size="29" font-weight="700">基础组件</text>
<text x="80" y="331" fill="#b9cae2" font-size="19">认识每一种工具的职责</text>
<text x="80" y="379" fill="#fff" font-size="19">加密：XOR / AES / 流密码</text><text x="80" y="415" fill="#fff" font-size="19">摘要与认证：哈希 / MAC / 签名</text><text x="80" y="451" fill="#fff" font-size="19">密钥：交换 / 派生 / 随机数</text>
<text x="80" y="491" fill="#7dd3fc" font-size="18">回答：各组件解决什么问题？</text><rect x="458" y="212" width="364" height="306" rx="12" fill="#1d304c" stroke="#40536d"/>
<text x="482" y="252" fill="#7dd3fc" font-size="18">02</text>
<text x="482" y="294" fill="#fff" font-size="29" font-weight="700">漏洞案例</text>
<text x="482" y="331" fill="#b9cae2" font-size="19">观察错误设计怎样失效</text>
<text x="482" y="379" fill="#fff" font-size="19">ECB：重复结构泄漏</text><text x="482" y="415" fill="#fff" font-size="19">位翻转：密文能被篡改</text><text x="482" y="451" fill="#fff" font-size="19">长度扩展与随机数问题</text>
<text x="482" y="491" fill="#7dd3fc" font-size="18">回答：方案还缺哪种保护？</text><rect x="860" y="212" width="364" height="306" rx="12" fill="#1d304c" stroke="#40536d"/>
