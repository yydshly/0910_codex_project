<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Awesome OSINT Arsenal：目录、安装与工具执行的分工</title><desc id="desc">仓库提供753条目录记录及批量安装脚本。使用者选择并准备第三方工具，工具自行执行查询或分析，使用者核验结果。本展示未安装工具。</desc><rect width="1200" height="480" fill="#122e4b"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="44" y="54" fill="#9df0eb" font-size="17">010 / AWESOME OSINT ARSENAL</text><text x="44" y="104" fill="white" font-size="33" font-weight="bold">从“找到工具”到“得到结论”，分别是谁在工作？</text><g fill="#203f5e" stroke="#49617b"><rect x="44" y="152" width="254" height="200" rx="8"/><rect x="330" y="152" width="254" height="200" rx="8"/><rect x="616" y="152" width="254" height="200" rx="8"/><rect x="902" y="152" width="254" height="200" rx="8"/></g><g fill="#9df0eb" font-size="16"><text x="64" y="188">01 / 合集</text><text x="350" y="188">02 / 使用者 + 安装器</text><text x="636" y="188">03 / 第三方工具</text><text x="922" y="188">04 / 使用者</text></g><g fill="white" font-size="26" font-weight="bold"><text x="64" y="232">提供工具目录</text><text x="350" y="232">选择、准备工具</text><text x="636" y="232">执行查询或分析</text><text x="922" y="232">核验并形成结论</text></g><g fill="#c9d9e9" font-size="17"><text x="64" y="273">名称 / 用途 / 获取方式</text><text x="64" y="306">753 条记录 · 26 类数据</text><text x="350" y="273">安装软件或下载源码</text><text x="350" y="306">继续配置所需条件</text><text x="636" y="273">例如 Maigret / ExifTool</text><text x="636" y="306">各自返回候选或字段</text><text x="922" y="273">核对来源、时效与关联</text><text x="922" y="306">保留证据与不确定性</text></g><g stroke="#9df0eb" stroke-width="2" fill="none"><path d="M302 254h20m-6-6 6 6-6 6"/><path d="M588 254h20m-6-6 6 6-6 6"/><path d="M874 254h20m-6-6 6 6-6 6"/></g><text x="44" y="402" fill="#9df0eb" font-size="20">合集负责发现与准备工具；它没有统一实现后续的自动调查与报告。</text><text x="44" y="443" fill="#b0c7dc" font-size="14">依据上游提交 2c6475a 原创绘制 · 非运行截图 · 此次仅整理与展示，不安装工具</text></g></svg>
