<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Plinkopinball 能力与技术流程</title><desc id="desc">Blender 模型与烘焙贴图，经碰撞提取和物理计算，由 Three.js 与 Howler 输出画面和声音。包含原版体验、中文实验与源码拆解。</desc><rect width="1200" height="640" fill="#102a2c"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="58" y="62" fill="#c6dd83" font-size="18" letter-spacing="2">013 / PLINKOPINBALL</text><text x="58" y="133" fill="#f5f7ef" font-size="42" font-weight="700">三维场景，如何变成可玩的网页？</text><text x="58" y="179" fill="#b5cbc5" font-size="21">投球 · 挡板 · 物理碰撞 · 动态声音 · Blender 资源流程</text><g fill="#1c4141" stroke="#54716b"><rect x="58" y="236" width="243" height="203" rx="4"/><rect x="338" y="236" width="243" height="203" rx="4"/><rect x="618" y="236" width="243" height="203" rx="4"/><rect x="898" y="236" width="244" height="203" rx="4"/></g><g font-size="15" fill="#c6dd83"><text x="80" y="272">01 / ASSETS</text><text x="360" y="272">02 / GEOMETRY</text><text x="640" y="272">03 / PHYSICS</text><text x="920" y="272">04 / FEEDBACK</text></g><g fill="#f5f7ef" font-size="25" font-weight="600"><text x="80" y="318">模型与烘焙</text><text x="360" y="318">提取碰撞边界</text><text x="640" y="318">计算小球运动</text><text x="920" y="318">画面与声音</text></g><g fill="#b5cbc5" font-size="17"><text x="80" y="361">提前计算静态光照</text><text x="80" y="391">GLB 模型 + 贴图</text><text x="360" y="361">截面拼接成轮廓</text><text x="360" y="391">圆形 + 折线碰撞体</text><text x="640" y="361">二维世界 + 曲线轨道</text><text x="640" y="391">输入与碰撞驱动运动</text><text x="920" y="361">实例化批量绘制</text><text x="920" y="391">运动状态驱动音效</text></g><g fill="#c6dd83" font-size="28"><text x="310" y="342">→</text><text x="590" y="342">→</text><text x="870" y="342">→</text></g><path d="M58 489H1142" stroke="#54716b"/><text x="58" y="537" fill="#e9f0df" font-size="22">原版 3D 体验</text><text x="358" y="537" fill="#e9f0df" font-size="22">中文原理实验</text><text x="658" y="537" fill="#e9f0df" font-size="22">固定版本源码拆解</text><text x="58" y="589" fill="#9fb8af" font-size="16">图源：本研究依据提交 64a896e 原创绘制 · 非产品截图 · 教学实验独立实现</text></g></svg>
